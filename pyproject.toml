[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oopsie-data-tools"
version = "0.9"
description = "Collect, annotate, validate and upload robotic manipulation rollout data."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.3",
    "flask>=3.0.0",
    "h5py>=3.7.0",
    "huggingface-hub>=0.36.2",
    "imageio>=2.35.1",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.20.0",
    # Floor is what our cv2 calls need, not what is ABI-safe: opencv-python < 4.10 is built
    # against numpy 1 and fails to import under numpy 2 without declaring the conflict.
    "opencv-python>=4.6.0.66",
    "pyyaml>=6.0.0",
    "scipy>=1.10.1",
]

# Installed by a bare `uv sync`; not shipped to users of the published wheel.
[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.6",
]

[project.scripts]
oopsie-data = "oopsie_data_tools.cli:main"

[project.optional-dependencies]
# For droid robot inference, needed only by examples/inference_examples/.
# Install with: uv sync --extra droid
# Note: openpi_client and droid.robot_env must be installed separately (not on PyPI)
droid = [
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "tqdm>=4.66.0",
    "tyro>=0.9.0",
]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
# E501 (line length) is deliberately out: the existing wrapping is close enough that
# enforcing it would bury the real findings under hundreds of reflow diffs.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "FA"]

[tool.ruff.lint.per-file-ignores]
# Every exemption here is scoped to the exact file and rule that still needs it, so the
# remaining debt is visible rather than hidden. Never re-introduce a blanket `# ruff: noqa`
# at the top of a file — that is what concealed the undefined names in the examples.
#
# What is left is pre-existing style in the older act_plus_plus scripts: lambdas assigned
# to names, bare excepts around the Interbotix SDK, and unused locals. The examples are
# maintained as near-verbatim upstream copies, so these are deliberately not chased.
"examples/inference_examples/act_plus_plus/run_policy.py" = ["E711", "E722", "E731", "F841"]
"examples/inference_examples/act_plus_plus/run_policy_browser.py" = ["E722", "E731", "F841"]
"examples/inference_examples/act_plus_plus/run_policy_inloop.py" = ["E722", "E731", "F841"]
"examples/inference_examples/act_plus_plus/run_policy_bulk.py" = ["E722", "E731", "F841"]

[tool.pytest.ini_options]
testpaths = ["oopsie_data_tools/test"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    # imageio-ffmpeg and its dependencies emit these on import under Python 3.8.
    "default::DeprecationWarning",
    "default::ImportWarning",
]
